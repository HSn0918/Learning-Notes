apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hami-mac-plugin
  namespace: kube-system
  labels:
    app: hami-mac-plugin
spec:
  selector:
    matchLabels:
      app: hami-mac-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hami-mac-plugin
    spec:
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      hostNetwork: false
      containers:
        - name: hami-mac-plugin
          image: learning-notes/hami-mac:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          args:
            - "-v=2"
          env:
            # 4 张物理卡, 每张切 10 份 -> Node capacity nvidia.com/gpu = 40.
            - name: HAMI_MAC_PHYS_CARDS
              value: "4"
            - name: HAMI_MAC_VGPU_PER_CARD
              value: "10"
            # Allocate 时若 Pod 没显式声明, 注入这个默认配额.
            # 真实 HAMi 是由 webhook 改写 Pod spec, 这里简化为进程级默认.
            - name: HAMI_MAC_DEFAULT_MEM
              value: "3000"
            - name: HAMI_MAC_DEFAULT_CORES
              value: "30"
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory

# KubeSchedulerConfiguration 示例：在一个独立 profile 里启用 NodeLabelScore。
#
# 用法：把本文件挂载到 scheduler-plugin Pod 里，并在容器命令行加 --config=/path/to/config.yaml。
# 业务 Pod 通过 spec.schedulerName: learning-plan-scheduler 走到这套打分逻辑。

apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration

leaderElection:
  leaderElect: true
  # 注意：与 default-scheduler 抢锁会出问题，必须用独立的 resourceName。
  resourceName: learning-plan-scheduler
  resourceNamespace: kube-system

profiles:
  - schedulerName: learning-plan-scheduler
    plugins:
      score:
        enabled:
          # 启用自定义插件；weight 决定它在总分里的占比。
          - name: NodeLabelScore
            weight: 5
          # 同时保留默认的若干 Score 插件，让 Pod 仍然有合理的资源/亲和性偏好。
          # 如果只想留自定义打分，可以在 disabled 里写 "*" 关掉全部 in-tree 打分插件。
        # disabled:
        #   - name: "*"
    pluginConfig:
      # 如果以后给 NodeLabelScore 加 Args，可以在这里传：
      # - name: NodeLabelScore
      #   args:
      #     preferredLabelKey: learning-plan/preferred
      #     preferredLabelValue: "true"

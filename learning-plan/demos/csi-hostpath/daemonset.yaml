# csi-hostpath 部署清单。生产 CSI driver 一般拆成两套 workload：
#   - StatefulSet:  Controller Pod (driver + external-provisioner + external-attacher + ...)
#   - DaemonSet:    Node Pod       (driver + node-driver-registrar + livenessprobe)
#
# 本 demo 同样按此结构组织。注意：images / RBAC / 资源限制都按教学示例填，
# 上集群之前请按需调整（特别是把 image 换成自己仓库里 build 出来的 csi-hostpath 镜像）。

---
# ServiceAccount + RBAC（最简化版本，生产请参考 kubernetes-csi/external-* 仓库的 sample-rbac.yaml）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-hostpath
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-hostpath
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-hostpath
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-hostpath
subjects:
  - kind: ServiceAccount
    name: csi-hostpath
    namespace: kube-system

---
# Controller Pod：跑 driver 进程 + external-provisioner（dynamic provisioning）。
# 不需要 external-attacher，因为 CSIDriver.spec.attachRequired=false。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: csi-hostpath-controller
  namespace: kube-system
spec:
  serviceName: csi-hostpath-controller
  replicas: 1
  selector:
    matchLabels:
      app: csi-hostpath-controller
  template:
    metadata:
      labels:
        app: csi-hostpath-controller
    spec:
      serviceAccountName: csi-hostpath
      containers:
        # ---------- sidecar：external-provisioner ----------
        # watch PVC，调 driver.CreateVolume / DeleteVolume，把结果写回 PV 对象。
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.0.0
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=false
            - --extra-create-metadata=true
            - --v=4
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        # ---------- driver 本体 ----------
        - name: csi-hostpath
          image: ghcr.io/learning-notes/csi-hostpath:dev   # 自行 build
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-id=controller   # controller 模式下 node-id 不会被 K8s 用到
            - --data-root=/var/lib/csi-hostpath
            - --v=4
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}

---
# Node Pod：每个节点跑一份，负责 NodePublishVolume / NodeUnpublishVolume。
# 关键：通过 hostPath 把 /var/lib/kubelet 整个挂进 driver 容器，让 driver 能看到
# kubelet 给的 targetPath（如 /var/lib/kubelet/pods/<uid>/volumes/...）。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-hostpath-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-hostpath-node
  template:
    metadata:
      labels:
        app: csi-hostpath-node
    spec:
      serviceAccountName: csi-hostpath
      hostNetwork: true
      containers:
        # ---------- sidecar：node-driver-registrar ----------
        # 通过 /registration/<driver>-reg.sock 向 kubelet 注册本驱动。
        - name: csi-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/learning-plan.csi.k8s.io/csi.sock
            - --v=4
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        # ---------- sidecar：livenessprobe ----------
        # 暴露 HTTP /healthz，被 kubelet liveness probe 周期性调用。
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.13.0
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9898
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
        # ---------- driver 本体 ----------
        - name: csi-hostpath
          image: ghcr.io/learning-notes/csi-hostpath:dev
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(KUBE_NODE_NAME)
            - --data-root=/var/lib/csi-hostpath
            - --v=4
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # 关键：要能在节点 mount 命名空间里做 bind mount，必须 privileged。
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            # bidirectional mount propagation：driver 在 pods-mount-dir 里做的 mount
            # 必须能被 kubelet（host mount namespace）看到，否则 Pod 容器里看不到挂载。
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: data-root
              mountPath: /var/lib/csi-hostpath
      volumes:
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/learning-plan.csi.k8s.io/
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: data-root
          hostPath:
            # 卷源目录直接挂主机的 /var/lib/csi-hostpath，节点重启后数据仍在。
            path: /var/lib/csi-hostpath
            type: DirectoryOrCreate
